{% extends "base.html" %}

{% block title %}
Access Denied
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-code">
        403
    </div>

    <h1>Access Denied</h1>

    <p>
        You do not have permission to access this page.
    </p>

    <div class="error-page-actions">

        <a
            class="button"
            href="{{ url_for('home') }}"
        >
            Return Home
        </a>

        {% if not current_user.is_authenticated %}

            <a
                class="button button-secondary"
                href="{{ url_for('login') }}"
            >
                Login
            </a>

        {% endif %}

    </div>

</div>

{% endblock %}
